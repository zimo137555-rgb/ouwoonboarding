<!doctype html><html lang="zh-CN" data-owo-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9f97eb"><title>鸥我 · 窄屏343版</title><style>
:root {
  color-scheme: light dark;

  /* Color Tokens */
  --owo-color-brand: #9f97eb;
  --owo-color-brand-strong: #7e72d9;
  --owo-color-brand-soft: rgba(159, 151, 235, 0.12);
  --owo-color-on-brand: #ffffff;
  --owo-color-bg: #f3f4f8;
  --owo-color-bg-app: #ffffff;
  --owo-color-bg-soft: #f8f8fc;
  --owo-color-card: #ffffff;
  --owo-color-card-muted: #f8f8fc;
  --owo-color-nav: rgba(255, 255, 255, 0.88);
  --owo-color-bar: rgba(255, 255, 255, 0.92);
  --owo-color-glass: rgba(255, 255, 255, 0.66);
  --owo-color-input: rgba(255, 255, 255, 0.72);
  --owo-color-scrim: rgba(20, 20, 24, 0.42);
  --owo-color-text-primary: #111111;
  --owo-color-text-secondary: #555555;
  --owo-color-text-tertiary: #999999;
  --owo-color-placeholder: #999999;
  --owo-color-border: #ececec;
  --owo-color-border-soft: rgba(159, 151, 235, 0.12);
  --owo-color-success: #059669;
  --owo-color-warning: #f59e0b;
  --owo-color-error: #ef4444;
  --owo-color-info: #2563eb;
  --owo-color-ai: #9f97eb;
  --owo-gradient-brand: linear-gradient(135deg, #9f97eb, #9f97eb);

  /* Platform Semantic Color Roles */
  --owo-ios-label: var(--owo-color-text-primary);
  --owo-ios-secondary-label: var(--owo-color-text-secondary);
  --owo-ios-tertiary-label: var(--owo-color-text-tertiary);
  --owo-ios-background: var(--owo-color-bg-app);
  --owo-ios-secondary-background: var(--owo-color-bg-soft);
  --owo-ios-separator: var(--owo-color-border);
  --owo-md-primary: var(--owo-color-brand);
  --owo-md-on-primary: var(--owo-color-on-brand);
  --owo-md-primary-container: #ede9fe;
  --owo-md-on-primary-container: #2e1065;
  --owo-md-surface: var(--owo-color-card);
  --owo-md-surface-variant: #f1f0f7;
  --owo-md-background: var(--owo-color-bg);
  --owo-md-outline: #79747e;

  /* Typography Tokens */
  --owo-font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Noto Sans SC", sans-serif;
  --owo-font-android: Roboto, "Noto Sans SC", "PingFang SC", sans-serif;
  --owo-font-harmony: "HarmonyOS Sans", Roboto, "Noto Sans SC", sans-serif;
  --owo-font-hyperos: MiSans, Roboto, "Noto Sans SC", sans-serif;
  --owo-font-coloros: "OPPO Sans", Roboto, "Noto Sans SC", sans-serif;
  --owo-font-originos: "vivo Sans", Roboto, "Noto Sans SC", sans-serif;
  --owo-font-family: var(--owo-font-ios);
  --owo-font-page-title: 24px;
  --owo-font-module-title: 16px;
  --owo-font-body: 14px;
  --owo-font-assist: 12px;
  --owo-font-button: 15px;
  --owo-font-label: 11px;
  --owo-font-caption: 11px;
  --owo-dynamic-type-scale: 1;
  --owo-md-display-large: 57px;
  --owo-md-headline-large: 32px;
  --owo-md-title-large: 22px;
  --owo-md-body-large: 16px;
  --owo-md-body-medium: 14px;
  --owo-md-label-large: 14px;
  --owo-line-title: 1.24;
  --owo-line-body: 1.6;
  --owo-weight-title: 900;
  --owo-weight-body: 500;
  --owo-weight-action: 800;

  /* Spacing Tokens */
  --owo-space-1: 4px;
  --owo-space-2: 8px;
  --owo-space-3: 12px;
  --owo-space-4: 16px;
  --owo-space-5: 24px;
  --owo-space-6: 32px;

  /* Radius Tokens */
  --owo-radius-button: 14px;
  --owo-radius-card: 16px;
  --owo-radius-input: 14px;
  --owo-radius-modal: 24px;
  --owo-radius-sheet: 28px;
  --owo-radius-avatar: 999px;
  --owo-radius-tag: 999px;

  /* Shadow Tokens */
  --owo-shadow-none: none;
  --owo-shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
  --owo-shadow-md: 0 8px 28px rgba(0, 0, 0, 0.07);
  --owo-shadow-lg: 0 16px 44px rgba(40, 30, 80, 0.14);
  --owo-shadow-floating: 0 20px 60px rgba(0, 0, 0, 0.22);

  /* Mobile Layout Tokens */
  --owo-screen-max: 430px;
  --owo-screen-min: 320px;
  --owo-screen-ratio: 393 / 852;
  --owo-touch-target-ios: 44px;
  --owo-touch-target-android: 48px;
  --owo-touch-target: 48px;
  --owo-safe-top: env(safe-area-inset-top, 0px);
  --owo-safe-right: env(safe-area-inset-right, 0px);
  --owo-safe-bottom: env(safe-area-inset-bottom, 0px);
  --owo-safe-left: env(safe-area-inset-left, 0px);
  --owo-safe-status-top: max(54px, calc(var(--owo-safe-top) + 14px));
  --owo-safe-content-top: max(16px, calc(var(--owo-safe-top) + 12px));
  --owo-safe-content-bottom: max(24px, calc(var(--owo-safe-bottom) + 16px));
  --owo-nav-safe-bottom: max(34px, calc(var(--owo-safe-bottom) + 14px));
  --owo-adaptive-rail-width: 88px;
  --owo-adaptive-pane-gap: 24px;
  --owo-breakpoint-compact-max: 599px;
  --owo-breakpoint-medium-min: 600px;
  --owo-breakpoint-expanded-min: 840px;
  --owo-adaptive-list-min: 280px;
  --owo-adaptive-detail-min: 360px;
  --owo-fold-hinge-left: 0px;
  --owo-fold-hinge-right: 0px;
  --owo-fold-hinge-top: 0px;
  --owo-fold-hinge-bottom: 0px;
  --owo-fold-hinge-width: 0px;
  --owo-fold-hinge-height: 0px;
}

:root[data-owo-platform="android"],
:root[data-owo-platform="generic-android"] {
  --owo-font-family: var(--owo-font-android);
}

:root[data-owo-platform="harmony"] {
  --owo-font-family: var(--owo-font-harmony);
}

:root[data-owo-platform="hyperos"] {
  --owo-font-family: var(--owo-font-hyperos);
}

:root[data-owo-platform="coloros"] {
  --owo-font-family: var(--owo-font-coloros);
}

:root[data-owo-platform="originos"],
:root[data-owo-platform="magicos"] {
  --owo-font-family: var(--owo-font-originos);
}

:root[data-owo-theme="dark"] {
  color-scheme: dark;
  --owo-color-bg: #0f0f14;
  --owo-color-bg-app: #121212;
  --owo-color-bg-soft: #1c1c22;
  --owo-color-card: #1f1f27;
  --owo-color-card-muted: #24242c;
  --owo-color-nav: rgba(28, 28, 34, 0.88);
  --owo-color-bar: rgba(28, 28, 34, 0.92);
  --owo-color-glass: rgba(31, 31, 39, 0.78);
  --owo-color-input: rgba(36, 36, 44, 0.86);
  --owo-color-scrim: rgba(0, 0, 0, 0.56);
  --owo-color-text-primary: #f5f5f7;
  --owo-color-text-secondary: #c7c7cc;
  --owo-color-text-tertiary: #a1a1aa;
  --owo-color-placeholder: #9898a3;
  --owo-color-border: rgba(255, 255, 255, 0.14);
  --owo-color-border-soft: rgba(255, 255, 255, 0.10);
  --owo-ios-background: #000000;
  --owo-ios-secondary-background: #1c1c1e;
  --owo-ios-separator: rgba(255, 255, 255, 0.16);
  --owo-md-primary-container: #3b2167;
  --owo-md-on-primary-container: #f3e8ff;
  --owo-md-surface: #121212;
  --owo-md-surface-variant: #24242c;
  --owo-md-background: #121212;
  --owo-shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.26);
  --owo-shadow-md: 0 8px 28px rgba(0, 0, 0, 0.34);
  --owo-shadow-lg: 0 16px 44px rgba(0, 0, 0, 0.42);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-owo-theme="light"]) {
    color-scheme: dark;
    --owo-color-bg: #0f0f14;
    --owo-color-bg-app: #121212;
    --owo-color-bg-soft: #1c1c22;
    --owo-color-card: #1f1f27;
    --owo-color-card-muted: #24242c;
    --owo-color-nav: rgba(28, 28, 34, 0.88);
    --owo-color-bar: rgba(28, 28, 34, 0.92);
    --owo-color-glass: rgba(31, 31, 39, 0.78);
    --owo-color-input: rgba(36, 36, 44, 0.86);
    --owo-color-scrim: rgba(0, 0, 0, 0.56);
    --owo-color-text-primary: #f5f5f7;
    --owo-color-text-secondary: #c7c7cc;
    --owo-color-text-tertiary: #a1a1aa;
    --owo-color-placeholder: #9898a3;
    --owo-color-border: rgba(255, 255, 255, 0.14);
    --owo-color-border-soft: rgba(255, 255, 255, 0.10);
    --owo-md-surface: #121212;
    --owo-md-surface-variant: #24242c;
    --owo-md-background: #121212;
  }
}

function updateNameState(e,limit){if(!e||!e.isConnected)return;if(limit)e.value=twenty(e.value);s.nameDraft=e.value;var button=document.querySelector('[data-act="three-name-next"]');if(button)button.disabled=!e.value.trim();var count=document.getElementById('three-name-count');if(count)count.textContent=Array.from(e.value).length+'/20';save();}

function initFirst(){if(s.spiritPhase==='forming'){initBirth();return;}if(s.spiritPhase==='wake'){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('.wake-orbits').forEach(function(e){if(e.pauseAnimations)e.pauseAnimations();});return;}var e=document.querySelector('.chat-stream');if(e)e.scrollTop=e.scrollHeight;}function bindFirst(){var e=document.getElementById('three-name');if(!e)return;var composing=false,watch=0;function refresh(){updateNameState(e,!composing);}e.addEventListener('compositionstart',function(){composing=true;});e.addEventListener('compositionend',function(){composing=false;refresh();requestAnimationFrame(refresh);});e.addEventListener('input',function(ev){updateNameState(e,!(composing||ev.isComposing));});['change','blur','animationstart'].forEach(function(event){e.addEventListener(event,refresh);});e.addEventListener('paste',function(){setTimeout(refresh,0);});e.addEventListener('focus',function(){cancelAnimationFrame(watch);function observe(){if(!e.isConnected||document.activeElement!==e)return;if(e.value!==s.nameDraft)refresh();watch=requestAnimationFrame(observe);}watch=requestAnimationFrame(observe);});e.addEventListener('blur',function(){cancelAnimationFrame(watch);});e.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&!ev.isComposing&&!composing){ev.preventDefault();refresh();threeNameNext();}});refresh();requestAnimationFrame(refresh);setTimeout(refresh,200);}
